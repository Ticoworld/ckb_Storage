[package]
name = "wo02-contract"
version = "0.1.0"
edition = "2024"
[features]
default = []
sumtype = []
[dependencies]
ckb-std = { version = "=1.1.0", default-features = false, features = ["allocator", "ckb-types"] }
blake2b-ref = "=0.3.1"
ed25519-dalek = { version = "=2.2.0", default-features = false }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
